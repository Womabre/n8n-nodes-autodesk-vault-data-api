name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Node 20 is not listed: the dev toolchain (@n8n/node-cli, via
        # isolated-vm) needs Node >= 22 and does not install on Node 20.
        node-version: ['22.x', '24.x']

    name: Node ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: 'npm ci'

      - name: Check formatting
        run: 'npm run format:check'

      - name: Run lint
        run: 'npm run lint'

      - name: Run tests
        run: 'npm test'

      - name: Run build
        run: 'npm run build'

      - name: Check package size
        # Guards against reference files or build caches ending up in the
        # published package again (it was ~980 KB before they were removed).
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const [pkg] = require("./pack.json");
            const limitKb = 500;
            const sizeKb = Math.round(pkg.unpackedSize / 1024);
            console.log(`Unpacked package size: ${sizeKb} KB in ${pkg.entryCount} files (limit ${limitKb} KB)`);
            if (sizeKb > limitKb) {
              const largest = [...pkg.files].sort((a, b) => b.size - a.size).slice(0, 5);
              for (const f of largest) console.log(`  ${Math.round(f.size / 1024)} KB  ${f.path}`);
              process.exit(1);
            }
          '
